; X035Pd: CH32X035 USB PD Sink slave firmware (the two PD trigger chips on the 48V10+10A ORing board)
; Clean-room rewrite: only does PD Sink negotiation and message forwarding; all policy is issued by the main controller V203 over UART (docs/PROTOCOL.md)
; No Bootloader: firmware starts at 0x0000 and is flashed as a whole image via USB ISP (wchisp)

[platformio]
default_envs = X035Pd

[env:X035Pd]
platform = ch32v
framework = noneos-sdk
board = genericCH32X035F8U6
board_build.f_cpu = 48000000L

board_build.use_lto = yes
board_build.use_builtin_startup_file = yes
board_build.use_builtin_system_code = yes
board_build.use_builtin_debug_code = no
board_build.cpp_support = no
; The last 1KB of Flash is reserved for nv.c (target voltage record)
board_build.ldscript = $PROJECT_DIR/ld/x035_pd.ld

build_unflags =
	-g

build_flags =
	-Wall
	-Wextra
	-Wno-unused-parameter
	-Wimplicit-function-declaration
	-Wl,--print-memory-usage
	-I src

upload_protocol = isp
