; 48V10+10A ORing main controller firmware (CH32V203C8T6)
; Toolchain kept identical to USB_PD_Trigger: platform = ch32v, framework = noneos-sdk

[platformio]
default_envs = MainCtrl_DEBUG

[common]
build_flags_common =
	-Wall
	-Wextra
	-Wimplicit-function-declaration
	-Wno-unused-parameter
	-Wno-format
	-Wunused-function
	-Wunused-variable
	-Wl,--print-memory-usage
	-I src

[env]
platform = ch32v
framework = noneos-sdk
board = genericCH32V203C8T6

; No crystal on board: HSI 8MHz -> PLL 144MHz (the build script defines SYSCLK_FREQ_144MHz_HSI automatically)
board_build.f_cpu = 144000000L
board_build.clock_source = hsi+pll

build_unflags =
	-g

board_build.use_lto = yes
board_build.use_builtin_startup_file = yes
board_build.use_builtin_system_code = yes
; The SDK's own debug.c Delay_Ms rewrites SysTick, and SDI printf blocks forever without a debugger, so it is not used
board_build.use_builtin_debug_code = no
board_build.cpp_support = no

; Last 4KB of flash (0x0800F000) is parameter storage (src/app/settings.c, 256-byte fast page erase); the program must not exceed 60KB
; (before v0.0.85 it was the last 8KB; the old record is read once from 0x0800E000 only when no new record is found)
board_upload.maximum_size = 61440
; Custom linker script: KEEP added to .vector (see the header notes in ld/Link_keepvec.ld)
board_build.ldscript = ld/Link_keepvec.ld

; Flash with wlink: erase only the sectors used by the program, preserving the parameter storage area (wch-link/OpenOCD erases the whole chip)
upload_protocol = wlink
debug_tool = wch-link

; Debug build: SDI virtual serial log temporarily disabled to free flash/RAM (change back to -DENABLE_SDI_LOG=1 when needed)
[env:MainCtrl_DEBUG]
build_flags =
	${common.build_flags_common}
	-DBUILD_DEBUG=1
	-DENABLE_SDI_LOG=0

; Release build: logging disabled
[env:MainCtrl_RELEASE]
build_flags =
	${common.build_flags_common}
	-DBUILD_RELEASE=1
	-DENABLE_SDI_LOG=0

; Diagnostic build: UART baud rate sweep (measures X035 clock deviation), does not handle the PD link
[env:MainCtrl_SWEEP]
build_flags =
	${common.build_flags_common}
	-DBUILD_DEBUG=1
	-DENABLE_SDI_LOG=1
	-DDIAG_BAUD_SWEEP=1
